#
# Setup local host as broker:kafka:29092 SASL_PLAINTEXT PLAIN admin admin
#
services:
  postgres:
    image: postgres:14
    container_name: conduktor-postgres
    environment:
      POSTGRES_DB: conduktor
      POSTGRES_USER: conduktor
      POSTGRES_PASSWORD: conduktor
    ports:
      - "5499:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ecommerce_network

  conduktor:
    image: conduktor/conduktor-platform:latest
    container_name: conduktor
    depends_on:
      - postgres
    ports:
      - "8083:8080"
    environment:
      CDK_DATABASE_URL: "postgresql://conduktor:conduktor@postgres:5432/conduktor"
      CDK_ORGANIZATION_NAME: "local-org"
      CDK_ADMIN_EMAIL: "admin@local.io"
      CDK_ADMIN_PASSWORD: "admin123"
    networks:
      - ecommerce_network

volumes:
  pgdata:

networks:
  ecommerce_network:
    external: true
    name: ecommerce_network