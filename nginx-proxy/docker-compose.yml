services:
  nginx:
    image: nginx:latest
    container_name: nginx-tls-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - grafana_grafana_network

networks:
  grafana_grafana_network:
    external: true